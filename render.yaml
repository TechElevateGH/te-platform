services:
  - type: web
    name: te-backend
    runtime: python
    region: oregon
    plan: free
    branch: deployment
    rootDir: te-backend
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_STR
        sync: false
      - key: PROJECT_NAME
        value: TechElevate Platform
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: DOMAIN
        sync: false
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: AUTHJWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: EMAILS_ENABLED
        value: false
      - key: EMAILS_FROM_NAME
        value: TechElevate
      - key: EMAILS_FROM_EMAIL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: ADMIN_BOOTSTRAP_USERNAME
        sync: false
      - key: ADMIN_BOOTSTRAP_TOKEN
        value: Admin
      - key: GDRIVE_RESUMES
        sync: false
      - key: GDRIVE_OTHER_FILES
        sync: false
      - key: GDRIVE_LESSONS
        sync: false
      - key: GOOGLE_PROJECT_ID
        sync: false
      - key: GOOGLE_PRIVATE_KEY_ID
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_X509_CERT_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend: te-frontend (Create React App) served as a Render Static Site
  # over Render's global CDN. Builds to te-frontend/build.
  # ---------------------------------------------------------------------------
  - type: web
    name: te-frontend
    runtime: static
    branch: deployment
    rootDir: te-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    # SPA fallback: serve index.html for client-side (React Router) routes.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      # Base URL of the te-backend API, INCLUDING the API prefix (API_STR).
      # e.g. https://te-backend.onrender.com/v1/  (set in the Render dashboard)
      - key: REACT_APP_API_URL
        sync: false
      # PostHog analytics (optional) — set in the dashboard if used.
      - key: REACT_APP_POSTHOG_KEY
        sync: false
      - key: REACT_APP_POSTHOG_HOST
        sync: false
      # Don't let CRA treat lint warnings as build-breaking errors on Render.
      - key: CI
        value: "false"
