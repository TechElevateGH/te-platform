services:
  - type: web
    name: te-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: te-backend
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_STR
        sync: false
      - key: PROJECT_NAME
        value: TechElevate Platform
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: DOMAIN
        # Public frontend URL (your custom domain). Set in the dashboard.
        # Backend redirects users to {DOMAIN}/auth/callback after Google OAuth
        # and uses it to enable production (secure-cookie) mode. Expected:
        # https://techelevate.org
        sync: false
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: AUTHJWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: BACKEND_CORS_ORIGINS
        # Comma-separated browser origins allowed to call the API (the frontend).
        value: https://techelevate.org,https://www.techelevate.org
      - key: EMAILS_ENABLED
        value: false
      - key: EMAILS_FROM_NAME
        value: TechElevate
      - key: EMAILS_FROM_EMAIL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: ADMIN_BOOTSTRAP_USERNAME
        sync: false
      - key: ADMIN_BOOTSTRAP_TOKEN
        value: Admin
      - key: GOOGLE_PROJECT_ID
        sync: false
      - key: GOOGLE_PRIVATE_KEY_ID
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_X509_CERT_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        # te-backend public URL + /v1/auth/google/callback. Must ALSO be added to
        # the OAuth client's "Authorized redirect URIs" in Google Cloud Console.
        # NOTE: confirm this matches your actual te-backend Render URL.
        value: https://te-backend-apq5.onrender.com/v1/auth/google/callback

  # ---------------------------------------------------------------------------
  # Frontend: te-frontend (Create React App) served as a Render Static Site
  # over Render's global CDN. Builds to te-frontend/build.
  # ---------------------------------------------------------------------------
  - type: web
    name: te-frontend
    runtime: static
    branch: main
    rootDir: te-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    # SPA fallback: serve index.html for client-side (React Router) routes.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      # Base URL of the te-backend API, INCLUDING the API prefix (API_STR) and a
      # trailing slash. CRA bakes REACT_APP_* at BUILD time, so changing this
      # requires a frontend rebuild/redeploy (Clear build cache & deploy).
      # NOTE: confirm this matches your actual te-backend Render URL.
      - key: REACT_APP_API_URL
        value: https://te-backend-apq5.onrender.com/v1/
      # PostHog analytics (optional) — set in the dashboard if used.
      - key: REACT_APP_POSTHOG_KEY
        sync: false
      - key: REACT_APP_POSTHOG_HOST
        sync: false
      # Don't let CRA treat lint warnings as build-breaking errors on Render.
      - key: CI
        value: "false"
