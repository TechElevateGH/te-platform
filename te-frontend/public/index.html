  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="TechElevate — an engineering-first career workspace: track applications, ship interview prep, manage referrals, and level up your CS skills."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/

      Notice the use of %PUBLIC_URL% in the tags above.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>TechElevate — Engineering Career Workspace</title>

    <style>
      /* Loading screen — monochrome terminal aesthetic */
      #app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        background-image: radial-gradient(rgba(15, 15, 15, 0.06) 1px, transparent 1px);
        background-size: 22px 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.3s ease-out;
      }

      #app-loading.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .loading-content {
        text-align: center;
      }

      .loading-logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        background: #111111;
        color: #ffffff;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: -0.04em;
        box-shadow: 0 1px 2px rgba(15, 15, 15, 0.08), 0 10px 30px rgba(15, 15, 15, 0.18);
        animation: pulse 2s ease-in-out infinite;
      }

      .loading-text {
        font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #111111;
        margin-bottom: 16px;
      }

      .loading-text .caret {
        display: inline-block;
        width: 9px;
        height: 1.05em;
        margin-left: 2px;
        vertical-align: text-bottom;
        background: #111111;
        animation: blink 1s steps(1) infinite;
      }

      .loading-spinner {
        width: 36px;
        height: 36px;
        margin: 0 auto;
        border: 2px solid #e5e5e5;
        border-top-color: #111111;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes blink {
        0%, 50% { opacity: 1; }
        50.01%, 100% { opacity: 0; }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        #app-loading {
          background: #191919;
          background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
        }
        .loading-logo {
          background: #ededec;
          color: #111111;
        }
        .loading-text {
          color: #ededec;
        }
        .loading-text .caret {
          background: #ededec;
        }
        .loading-spinner {
          border-color: #333333;
          border-top-color: #ededec;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Loading screen shown while React loads -->
    <div id="app-loading">
      <div class="loading-content">
        <div class="loading-logo">&gt;_</div>
        <div class="loading-text">techelevate<span class="caret"></span></div>
        <div class="loading-spinner"></div>
      </div>
    </div>

    <div id="root"></div>

  </body>
</html>
